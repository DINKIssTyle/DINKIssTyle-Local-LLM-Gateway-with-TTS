<?xml version="1.0" encoding="UTF-8"?>
<!--
  macOS menu-bar template source.
  Canvas: 36x36 px (18x18 pt at @2x).
  Keep the artwork monochrome and the background transparent. AppKit uses
  alpha as a template mask and automatically supplies the light/dark tint.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="5" width="26" height="26" rx="7" stroke-width="3"/>
    <path d="M12 14v8M24 14v8M12 18h12" stroke-width="3"/>
    <circle cx="18" cy="18" r="2.5" fill="#000000" stroke="none"/>
  </g>
</svg>
